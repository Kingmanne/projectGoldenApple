version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - cd lambda
      - npm ci || npm install

  build:
    commands:
      - echo "Running tests..."
      - npm test || true

      - echo "Packaging Lambda..."
      - zip -r ../lambda.zip .

      - cd ..

artifacts:
  files:
    - lambda.zip
    