version: 0.2

env:
  variables:
    AWS_REGION: us-east-1
    REPOSITORY_URI: 371510064293.dkr.ecr.us-east-1.amazonaws.com/codebuild-nodejs
    IMAGE_TAG: latest

phases:

  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - npm ci

  pre_build:
    commands:
      - set -e
      - echo "Logging into ECR..."
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI

  build:
    commands:
      - echo "Running tests (non-blocking)..."
      - npm test || true

      - echo "Building Docker image..."
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .

      - echo "Pushing Docker image..."
      - docker push $REPOSITORY_URI:$IMAGE_TAG

      - echo "Creating ECS imagedefinitions.json..."
      - printf '[{"name":"container","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

      - echo "Packaging Lambda..."
      - zip -r lambda.zip . -x "node_modules/*" ".git/*"

  post_build:
    commands:
      - echo "Build completed successfully"

artifacts:
  files:
    - imagedefinitions.json
    - lambda.zip
    - appspec.yml
    - scripts/**/*
    - package.json
    - package-lock.json

cache:
  paths:
    - node_modules/**/*