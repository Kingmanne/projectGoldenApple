version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo Installing dependencies...
      - npm ci

  pre_build:
    commands:
      - echo Running tests...
      - npm test || true

  build:
    commands:
      - echo Building application...

      # --- ECS (Docker image output handled by pipeline if using Docker build stage) ---
      - echo "Preparing ECS artifact..."
      - printf '[{"name":"container","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

      # --- Lambda package ---
      - echo "Creating Lambda package..."
      - zip -r lambda.zip .

  post_build:
    commands:
      - echo "Build complete"

artifacts:
  files:
    - imagedefinitions.json   # ECS
    - lambda.zip              # Lambda
    - appspec.yml             # EC2
    - scripts/**              # EC2
    - '**/*'
    