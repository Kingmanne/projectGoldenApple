version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing EC2 dependencies..."
      - cd ec2 && npm ci

  pre_build:
    commands:
      # Default environment if not set
      - export ENVIRONMENT=${ENVIRONMENT:-development}
      - echo "Using ENVIRONMENT=$ENVIRONMENT"

      # Fetch sour-mango parameters dynamically from SSM
      - export NODE_ENV=$(aws ssm get-parameter --name /sour-mango/$ENVIRONMENT/node-env --query 'Parameter.Value' --output text)
      - export APP_NAME=$(aws ssm get-parameter --name /sour-mango/$ENVIRONMENT/app-name --query 'Parameter.Value' --output text)
      - export PORT=$(aws ssm get-parameter --name /sour-mango/$ENVIRONMENT/port --query 'Parameter.Value' --output text)

      # Debug output
      - echo "NODE_ENV=$NODE_ENV"
      - echo "APP_NAME=$APP_NAME"
      - echo "PORT=$PORT"

      # Run EC2 tests
      - echo "Running EC2 tests..."
      - cd ec2 && npm test -- --coverage --coverageReporters=text
      - echo '=== Running security audit ==='
      - npm audit --audit-level=high
      - echo '=== Security audit passed ==='
      - npm audit --json > ../security-report.json || true

  build:
    commands:
      - echo "Creating .env file for EC2..."
      - cd ec2 && printf "NODE_ENV=%s\nAPP_NAME=%s\nPORT=%s\n" "$NODE_ENV" "$APP_NAME" "$PORT" > .env
      - echo ".env file created:"
      - cat ec2/.env

      - echo "Packaging Lambda..."
      - cd lambda && zip -r ../lambda-function.zip . && cd ..

  post_build:
    commands:
      - echo "Running EC2 smoke tests..."
      - cd ec2 && npm run test:smoke
      - echo "✅ Build completed successfully for $APP_NAME ($ENVIRONMENT)!"

artifacts:
  files:
    - appspec.yml
    - ec2/.env
    - ec2/package.json
    - ec2/package-lock.json
    - "ec2/public/**/*"
    - "ec2/scripts/**/*"
    - ec2/server.js
    - ec2/smoke-test.js
    - "ec2/__tests__/**/*"
    - infrastructure.yml
    - lambda-function.zip
    - security-report.json

  name: sour-mango-$ENVIRONMENT-artifact
  discard-paths: no
