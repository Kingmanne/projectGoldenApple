version: 0.2

env:
  variables:
    AWS_REGION: us-east-1
    REPOSITORY_URI: 371510064293.dkr.ecr.us-east-1.amazonaws.com/codebuild-nodejs
    IMAGE_TAG: latest

phases:

  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "Installing dependencies..."
      - npm ci

  pre_build:
    commands:
      - echo "Checking AWS identity..."
      - aws sts get-caller-identity

      - echo "Logging into ECR..."
      - aws ecr get-login-password --region us-east-1 > token.txt
      - cat token.txt | docker login --username AWS --password-stdin $REPOSITORY_URI

      - echo "Login completed"

  build:
    commands:
      - echo "Building Docker image..."
      - docker build -t $REPOSITORY_URI:$IMAGE_TAG .

      - echo "Tagging image..."
      - docker tag $REPOSITORY_URI:$IMAGE_TAG $REPOSITORY_URI:$IMAGE_TAG

      - echo "Creating ECS artifact..."
      - printf '[{"name":"container","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json

      - echo "Creating Lambda package..."
      - zip -r lambda.zip . -x "node_modules/*" ".git/*"

  post_build:
    commands:
      - echo "Pushing Docker image..."
      - docker push $REPOSITORY_URI:$IMAGE_TAG

      - echo "Build completed successfully"

artifacts:
  files:
    - imagedefinitions.json
    - lambda.zip
    - appspec.yml
    - scripts/**/*
  discard-paths: no
  