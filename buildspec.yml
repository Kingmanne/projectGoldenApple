version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 18
    commands:
      - echo "=== INSTALL PHASE ==="
      - echo "Root directory:"
      - ls -la

      # Install EC2 dependencies (safe check)
      - |
        if [ -d ec2 ]; then
          echo "Installing EC2 dependencies..."
          cd ec2
          npm ci
          cd ..
        else
          echo "❌ ec2 directory not found"
          exit 1
        fi

  pre_build:
    commands:
      - echo "=== PRE_BUILD PHASE ==="

      # Environment setup
      - export ENVIRONMENT=${ENVIRONMENT:-development}
      - echo "ENVIRONMENT=$ENVIRONMENT"

      # Fetch SSM parameters (safe fallbacks)
      - export NODE_ENV=$(aws ssm get-parameter --name /sour-mango/$ENVIRONMENT/node-env --query 'Parameter.Value' --output text 2>/dev/null || echo "development")
      - export APP_NAME=$(aws ssm get-parameter --name /sour-mango/$ENVIRONMENT/app-name --query 'Parameter.Value' --output text 2>/dev/null || echo "sour-mango")
      - export PORT=$(aws ssm get-parameter --name /sour-mango/$ENVIRONMENT/port --query 'Parameter.Value' --output text 2>/dev/null || echo "3000")

      - echo "NODE_ENV=$NODE_ENV"
      - echo "APP_NAME=$APP_NAME"
      - echo "PORT=$PORT"

      # Run EC2 tests safely
      - |
        if [ -d ec2 ]; then
          echo "Running EC2 tests..."
          cd ec2
          npm test -- --coverage --coverageReporters=text
          cd ..
        else
          echo "❌ ec2 directory missing"
          exit 1
        fi

      # Security audit (non-blocking)
      - echo "=== Security audit ==="
      - cd ec2 && npm audit --audit-level=high || true
      - cd ec2 && npm audit --json > ../security-report.json || true

  build:
    commands:
      - echo "=== BUILD PHASE ==="

      # Create EC2 .env
      - |
        if [ -d ec2 ]; then
          echo "Creating EC2 .env file..."
          printf "NODE_ENV=%s\nAPP_NAME=%s\nPORT=%s\n" "$NODE_ENV" "$APP_NAME" "$PORT" > ec2/.env
        fi

      # Package Lambda
      - |
        if [ -d lambda ]; then
          echo "Packaging Lambda..."
          cd lambda
          zip -r ../lambda-function.zip .
          cd ..
        else
          echo "⚠️ lambda directory not found"
        fi

      - echo "Final project structure:"
      - ls -R

  post_build:
    commands:
      - echo "=== POST_BUILD PHASE ==="

      # Optional smoke tests
      - |
        if [ -d ec2 ]; then
          cd ec2
          npm run test:smoke || true
          cd ..
        fi

      - echo "✅ Build completed successfully"

artifacts:
  files:
    - "**/*"
  discard-paths: no
  