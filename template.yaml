AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Simple Lambda for multi-platform test

Parameters:
  EnvironmentName:
    Type: String
    Default: dev

Resources:
  SimpleLambda:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${EnvironmentName}-simple-lambda"
      Runtime: nodejs18.x
      Handler: handler.handler
      CodeUri: lambda-function.zip
      Environment:
        Variables:
          NODE_ENV: !Ref EnvironmentName
      Policies:
        - AWSLambdaBasicExecutionRole

Outputs:
  LambdaFunctionName:
    Description: Lambda Function Name
    Value: !Ref SimpleLambda
